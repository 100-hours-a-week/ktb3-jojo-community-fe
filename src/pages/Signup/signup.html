<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아무 말 대잔치 - 회원가입</title>
    <link rel="stylesheet" href="../../shared/styles/global.css" />
    <link rel="stylesheet" href="../../shared/styles/layout.css" />
    <link rel="stylesheet" href="signup.css" />
  </head>
  <body>
    <div class="container">
      <div id="header" class="header"></div>

      <div id="signup">
        <div class="container-item">
          <div class="signup-box container-item-inner">
            <div class="form-title">회원가입</div>

            <form id="signupForm">
              <div class="form-group">
                <div class="profile-photo" id="photoBox">
                  <span class="plus-icon">+</span>
                </div>
                <input
                  type="file"
                  id="fileInput"
                  accept="image/*"
                  style="display: none"
                />
                <div class="helper-text"></div>
              </div>
              <div class="form-group">
                <label for="email">이메일*</label>
                <input
                  id="email"
                  name="email"
                  type="text"
                  placeholder="이메일을 입력해주세요"
                  required
                />
                <div class="helper-text"></div>
              </div>
              <div class="form-group">
                <label for="password">비밀번호*</label>
                <input
                  id="password"
                  name="password"
                  type="password"
                  placeholder="비밀번호를 입력해주세요"
                  required
                />
                <div class="helper-text"></div>
              </div>
              <div class="form-group">
                <label for="passwordConfirm">비밀번호 확인*</label>
                <input
                  id="passwordConfirm"
                  name="passwordConfirm"
                  type="password"
                  placeholder="비밀번호를 한번 더 입력해주세요"
                  required
                />
                <div class="helper-text"></div>
              </div>
              <div class="form-group">
                <label for="nickname">닉네임*</label>
                <input
                  id="nickname"
                  name="nickname"
                  type="text"
                  placeholder="닉네임을 입력해주세요"
                  required
                />
                <div class="helper-text"></div>
              </div>
              <button id="signupBtn" class="btn btn-primary" type="button">
                회원가입
              </button>
              <!-- 모달 -->
              <div id="signupConfirm" class="modal">
                <div class="modal-content">
                  <div class="modal-title">회원가입을 하시겠습니까?</div>
                  <div class="modal-buttons">
                    <button class="modal-btn-cancel" type="button">취소</button>
                    <button class="modal-btn-confirm" type="submit">
                      확인
                    </button>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./signup.js"></script>
  </body>
</html>
