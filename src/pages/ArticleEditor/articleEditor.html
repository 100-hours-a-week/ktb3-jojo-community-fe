<!DOCTYPE html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아무말 대잔치 로그인 페이지</title>
    <link rel="stylesheet" href="../../shared/styles/global.css" />
    <link rel="stylesheet" href="../../shared/styles/layout.css" />
    <link rel="stylesheet" href="articleEditor.css" />
  </head>
  <body>
    <div id="header" class="header"></div>
    <div id="write">
      <div class="container-item">
        <div class="write-box flex_col_center_gap1">
          <div class="form-title">게시물 작성</div>

          <form id="articleForm" class="write-form">
            <div class="form-group">
              <label for="articleTitle">제목*</label>
              <input
                id="articleTitle"
                name="title"
                maxlength="26"
                type="text"
                placeholder="제목을 입력해주세요. (최대 26글자)"
                required
              />
            </div>

            <div class="form-group">
              <label for="articleContent">내용*</label>
              <textarea
                id="articleContent"
                name="content"
                placeholder="내용을 입력해주세요."
                required
              ></textarea>
              <div class="helper-text"></div>
            </div>

            <div class="form-group">
              <label for="articleImage">이미지</label>
              <input
                id="articleImage"
                name="imageUrls"
                type="file"
                src="image"
                accept="image/*"
                multiple
              />
              <div id="imagePreviewList" class="image-preview-list"></div>
            </div>

            <button type="submit" class="btn btn-primary">완료</button>
          </form>
        </div>
      </div>
    </div>
    <script type="module" src="./articleEditor.js"></script>
  </body>
</html>
