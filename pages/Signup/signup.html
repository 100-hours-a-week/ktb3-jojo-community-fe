<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아무 말 대잔치 - 회원가입</title>
    <link rel="stylesheet" href="/shared/styles/global.css" />
    <link rel="stylesheet" href="/shared/styles/layout.css" />
    <link rel="stylesheet" href="./signup.css" />
  </head>
  <body>
    <div class="container">
      <div class="header flex_row_center">
        <button class="back-btn"><</button>
        <h1>아무 말 대잔치</h1>
      </div>

      <div id="signup">
        <div class="container-item">
          <div class="signup-box container-item-inner">
            <div class="form-title">회원가입</div>
            <div class="profile-photo">
              <span class="plus-icon">+</span>
            </div>
            <div class="form-group">
              <label>아이디*</label>
              <input type="text" placeholder="아이디를 입력해주세요" />
              <div class="helper-text">* helper text</div>
            </div>
            <div class="form-group">
              <label>비밀번호*</label>
              <input type="password" placeholder="비밀번호를 입력해주세요" />
              <div class="helper-text">* helper text</div>
            </div>
            <div class="form-group">
              <label>비밀번호 확인*</label>
              <input
                type="password"
                placeholder="비밀번호를 한번 더 입력해주세요"
              />
              <div class="helper-text">* helper text</div>
            </div>
            <div class="form-group">
              <label>닉네임*</label>
              <input type="text" placeholder="닉네임을 입력해주세요" />
              <div class="helper-text">* helper text</div>
            </div>
            <button class="btn btn-primary">회원가입</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 모달 -->
    <div id="signupConfirm" class="modal">
      <div class="modal-content">
        <div class="modal-title">회원가입을 하시겠습니까?</div>
        <div class="modal-buttons">
          <button class="modal-btn-cancel">취소</button>
          <button class="modal-btn-confirm">확인</button>
        </div>
      </div>
    </div>
  </body>
</html>
