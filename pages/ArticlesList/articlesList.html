<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아무 말 대잔치 게시글 리스트</title>
    <link rel="stylesheet" href="articlesList.css" />
    <link rel="stylesheet" href="/shared/styles/global.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div>
          <img
            id="goBackArrow"
            class="left-arrow deactivate"
            srcset="/assets/leftArrow.svg"
          />
          <h1>아무 말 대잔치</h1>
          <div class="avatar"></div>
        </div>
      </div>

      <div id="article-list">
        <div class="container-item">
          <!-- header -->
          <div class="list-header">
            <div class="list-header-text">
              <p>안녕하세요,</p>
              <p>아무 말 대잔치 <strong>게시판</strong>입니다.</p>
            </div>
            <div class="list-header-button">
              <button id="btnCreateArticle" class="btn btn-primary btn-small">
                게시글 작성
              </button>
            </div>
          </div>

          <div id="list">
            <template id="list-item-template">
              <div id="list-item" class="list-item">
                <div class="list-item-header">
                  <div class="list-item-title">제목 1</div>
                  <div class="list-item-meta">
                    <div>좋아요 0 댓글 0 조회수 0</div>
                    <div>2021-01-01 00:00:00</div>
                  </div>
                </div>
                <div class="list-item-footer">
                  <div class="list-item-avatar"></div>
                  <div class="list-item-user">더미 작성자 1</div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./js/index.js"></script>
  </body>
</html>
