<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아무 말 대잔치 - 게시물 상세</title>
    <link rel="stylesheet" href="/shared/styles/global.css" />
    <link rel="stylesheet" href="/shared/styles/layout.css" />
    <link rel="stylesheet" href="articleDetail.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div>
          <img
            id="goBackArrow"
            class="left-arrow"
            srcset="/assets/leftArrow.svg"
          />
          <h1>아무 말 대잔치</h1>
          <div class="avatar"></div>
        </div>
      </div>

      <div id="detail">
        <template id="articleContainerTemplate">
          <div class="container-item">
            <div class="detail-header">
              <div class="detail-title">제목 1</div>

              <div class="detail-header-meta flex_row_between">
                <div class="detail-header-meta-info flex_row_center_gap1">
                  <div class="detail-header-meta-author flex_row_center_gap1">
                    <div class="avatar"></div>
                    <div class="detail-author-nickname">더미 작성자 1</div>
                  </div>

                  <div class="detail-header-meta-date">2021-01-01 00:00:00</div>
                </div>
                <div id="actionButtons" class="action-buttons"></div>
              </div>
            </div>

            <div class="post-content">contents</div>

            <div id="postStats" class="post-stats"></div>

            <!-- 댓글 작성 form -->
            <form class="comment-form">
              <textarea
                class="comment-input"
                placeholder="댓글을 남겨주세요!"
              ></textarea>
              <div class="comment-footer">
                <button class="btn btn-primary">댓글 남기기</button>
              </div>
            </form>

            <div id="articleCommentSection" class="comment-section"></div>
          </div>
        </template>
      </div>
    </div>

    <!-- 댓글 item -->
    <template id="commentItem">
      <div class="comment-item">
        <div class="comment-item-meta flex_row_between">
          <div class="comment-meta-author flex_row_center_gap1">
            <div class="avatar"></div>
            <div class="comment-author-nickname">더미 작성자 1</div>
          </div>
          <div class="comment-date">2021-01-01 00:00:00</div>
        </div>
        <div class="comment-text">답글 내용</div>
      </div>
    </template>

    <!-- 모달 -->
    <div id="deletePostModal" class="modal">
      <div class="modal-content">
        <div class="modal-title">게시글을 삭제하시겠습니까?</div>
        <div class="modal-message">작성된 내용글 넓고 믿을 수 있습니다.</div>
        <div class="modal-buttons">
          <button class="modal-btn-cancel">취소</button>
          <button class="modal-btn-confirm">확인</button>
        </div>
      </div>
    </div>
    <script type="module" src="./js/index.js"></script>
  </body>
</html>
