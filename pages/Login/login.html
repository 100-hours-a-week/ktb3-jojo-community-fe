<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아무말 대잔치 로그인 페이지</title>
    <link rel="stylesheet" href="/shared/styles/global.css" />
    <link rel="stylesheet" href="/shared/styles/layout.css" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>아무 말 대잔치</h1>
      </div>

      <div id="login">
        <div class="container-item">
          <form id="loginForm" class="login-box container-item-inner">
            <div class="form-group">
              <label for="email">이메일</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="이메일을 입력해주세요"
              />
            </div>
            <div class="form-group">
              <label for="password">비밀번호</label>
              <input
                id="password"
                name="password"
                type="password"
                placeholder="비밀번호를 입력해주세요"
              />
              <div class="helper-text"></div>
            </div>
            <div class="btn-group flex_col_gap1">
              <button id="btnLoginSubmit" class="btn btn-primary" type="submit">
                로그인
              </button>
              <button id="btnMoveSignup" class="btn btn-text" type="button">
                회원가입
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script type="module" src="login.js"></script>
  </body>
</html>
