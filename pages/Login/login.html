<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아무말 대잔치 로그인 페이지</title>
    <link rel="stylesheet" href="/shared/styles/global.css" />
    <link rel="stylesheet" href="/shared/styles/layout.css" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>아무 말 대잔치</h1>
      </div>

      <div id="login">
        <div class="container-item">
          <div class="login-box container-item-inner">
            <div class="form-group">
              <label>아이디</label>
              <input type="text" placeholder="아이디를 입력해주세요" />
            </div>
            <div class="form-group">
              <label>비밀번호</label>
              <input type="password" placeholder="비밀번호를 입력해주세요" />
              <div class="helper-text">* helper text</div>
            </div>
            <div class="btn-group flex_col_gap1">
              <button class="btn btn-primary">로그인</button>
              <button class="btn btn-text">회원가입</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
