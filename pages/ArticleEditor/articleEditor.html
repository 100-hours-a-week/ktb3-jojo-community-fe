<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>아무말 대잔치 로그인 페이지</title>
        <link rel="stylesheet" href="/shared/styles/global.css">
        <link rel="stylesheet" href="/shared/styles/layout.css">
        <link rel="stylesheet" href="articleEditor.css">
    </head>
    <body>
        <div class="header">
            <div>
                <img
                    id="goBackArrow"
                    class="left-arrow"
                    srcset="/assets/leftArrow.svg"
                />
                <h1>아무 말 대잔치</h1>
                <div class="avatar"></div>
            </div>
        </div>
        <div id="write">
            <div class="container-item">
                <div class="write-box flex_col_center_gap1">
                    <div class="form-title">게시물 작성</div>
                    
                    <form class="write-form">
                        <div class="form-group">
                            <label>제목*</label>
                            <input type="text" placeholder="제목을 입력해주세요. (최대 26글자)" required>
                        </div>

                        <div class="form-group">
                            <label>내용*</label>
                            <textarea placeholder="내용을 입력해주세요." required></textarea>
                            <div class="helper-text">* helper text</div>
                        </div>

                        <div class="form-group">
                            <label>이미지</label>
                            <input type="file" src="image" required>
                        </div>

                        <button type="submit" class="btn btn-primary">완료</button>
                    </form>
                </div>
            </div>
            </div>
        </div>
    </body>
</html>
